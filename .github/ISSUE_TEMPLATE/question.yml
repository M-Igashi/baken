name: Question
description: Ask how something works
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **This issue is public and permanent.** Do not include your name, email address, phone number, postal address, Apple ID, or any order or receipt number. Paths you paste usually contain your home folder name, which is your real name on most machines: replace it with `[redacted]` before posting.
        >
        > Anything personal belongs at <baken@tyna.ninja> instead, never here.
  - type: markdown
    attributes:
      value: |
        The [README](https://github.com/M-Igashi/baken#readme) and the [FAQ on the website](https://baken.ravers.workers.dev) answer most questions already.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "3.3.2"
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
