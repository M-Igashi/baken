name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # =============================================================================
  # Build Jobs
  # =============================================================================

  # A tag pushed before the version bump would publish binaries, a release,
  # and a Homebrew formula under the wrong version, and fail only at
  # `cargo publish`. Every other job waits for this one.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Compare the tag with the workspace version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "baken") | .version')"
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::The tag says $TAG, Cargo.toml says $CRATE"
            exit 1
          fi

  # THIRD_PARTY_LICENSES.md for every archive, from about.toml and about.hbs.
  licenses:
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Generate
        run: cargo about generate -c about.toml -m crates/baken/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.md

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md

  build-macos:
    needs: [licenses]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Add targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Build arm64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p release
          lipo -create \
            target/aarch64-apple-darwin/release/baken \
            target/x86_64-apple-darwin/release/baken \
            -output release/baken

      # The runner is arm64, so this runs the arm64 slice.
      - name: Run the binary
        run: release/baken --version

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download third-party licenses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: release

      - name: Create tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cp LICENSE release/
          cd release
          tar -czvf baken-${VERSION}-macos-universal.tar.gz baken LICENSE THIRD_PARTY_LICENSES.md

      - name: Calculate SHA256
        id: sha256
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          SHA256=$(shasum -a 256 release/baken-${VERSION}-macos-universal.tar.gz | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: release/baken-${{ steps.version.outputs.VERSION }}-macos-universal.tar.gz

      - name: Save SHA256
        env:
          SHA256: ${{ steps.sha256.outputs.SHA256 }}
        run: echo "$SHA256" > sha256-macos-universal.txt

      - name: Upload SHA256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256-macos-universal
          path: sha256-macos-universal.txt

  # Ubuntu 22.04, so the binaries ask for glibc 2.35 and not for whatever
  # ubuntu-latest carries (2.39 up to 4.11.0, which Ubuntu 22.04 and Debian 12
  # do not have).
  build-linux-x86_64:
    needs: [licenses]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked

      - name: Run the binary
        run: target/release/baken --version

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download third-party licenses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: release

      - name: Create tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cp target/release/baken LICENSE release/
          cd release
          tar -czvf baken-${VERSION}-linux-x86_64.tar.gz baken LICENSE THIRD_PARTY_LICENSES.md

      - name: Calculate SHA256
        id: sha256
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          SHA256=$(sha256sum release/baken-${VERSION}-linux-x86_64.tar.gz | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: release/baken-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz

      - name: Save SHA256
        env:
          SHA256: ${{ steps.sha256.outputs.SHA256 }}
        run: echo "$SHA256" > sha256-linux-x86_64.txt

      - name: Upload SHA256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256-linux-x86_64
          path: sha256-linux-x86_64.txt

  # Built on an arm64 runner: no cross, no Docker image, and the binary can
  # be run where it was built.
  build-linux-aarch64:
    needs: [licenses]
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked

      - name: Run the binary
        run: target/release/baken --version

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download third-party licenses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: release

      - name: Create tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cp target/release/baken LICENSE release/
          cd release
          tar -czvf baken-${VERSION}-linux-aarch64.tar.gz baken LICENSE THIRD_PARTY_LICENSES.md

      - name: Calculate SHA256
        id: sha256
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          SHA256=$(sha256sum release/baken-${VERSION}-linux-aarch64.tar.gz | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-aarch64
          path: release/baken-${{ steps.version.outputs.VERSION }}-linux-aarch64.tar.gz

      - name: Save SHA256
        env:
          SHA256: ${{ steps.sha256.outputs.SHA256 }}
        run: echo "$SHA256" > sha256-linux-aarch64.txt

      - name: Upload SHA256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256-linux-aarch64
          path: sha256-linux-aarch64.txt

  build-windows:
    needs: [licenses]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked

      - name: Run the binary
        run: target\release\baken.exe --version

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download third-party licenses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: release

      - name: Create zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          Copy-Item target\release\baken.exe, LICENSE release\
          Compress-Archive -Path release\baken.exe, release\LICENSE, release\THIRD_PARTY_LICENSES.md -DestinationPath release\baken-${env:VERSION}-windows-x86_64.zip

      - name: Calculate SHA256
        id: sha256
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $hash = (Get-FileHash release\baken-${env:VERSION}-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: release/baken-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip

      - name: Save SHA256
        shell: bash
        env:
          SHA256: ${{ steps.sha256.outputs.SHA256 }}
        run: echo "$SHA256" > sha256-windows-x86_64.txt

      - name: Upload SHA256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256-windows-x86_64
          path: sha256-windows-x86_64.txt

  # =============================================================================
  # Release Job - Create GitHub Release
  # =============================================================================

  release:
    needs: [build-macos, build-linux-x86_64, build-linux-aarch64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      version_num: ${{ steps.version.outputs.VERSION_NUM }}
      macos_sha256: ${{ steps.macos_sha256.outputs.SHA256 }}
      windows_sha256: ${{ steps.windows_sha256.outputs.SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          mv artifacts/macos-universal/*.tar.gz release/
          mv artifacts/linux-x86_64/*.tar.gz release/
          mv artifacts/linux-aarch64/*.tar.gz release/
          mv artifacts/windows-x86_64/*.zip release/

      - name: Create checksums file
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd release
          cat ../artifacts/sha256-macos-universal/sha256-macos-universal.txt | while read hash; do echo "$hash  baken-${VERSION}-macos-universal.tar.gz"; done > checksums.txt
          cat ../artifacts/sha256-linux-x86_64/sha256-linux-x86_64.txt | while read hash; do echo "$hash  baken-${VERSION}-linux-x86_64.tar.gz"; done >> checksums.txt
          cat ../artifacts/sha256-linux-aarch64/sha256-linux-aarch64.txt | while read hash; do echo "$hash  baken-${VERSION}-linux-aarch64.tar.gz"; done >> checksums.txt
          cat ../artifacts/sha256-windows-x86_64/sha256-windows-x86_64.txt | while read hash; do echo "$hash  baken-${VERSION}-windows-x86_64.zip"; done >> checksums.txt
          mv checksums.txt baken-${VERSION}-checksums.txt

      - name: Get macOS SHA256
        id: macos_sha256
        run: |
          SHA256=$(cat artifacts/sha256-macos-universal/sha256-macos-universal.txt)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Get Windows SHA256
        id: windows_sha256
        run: |
          SHA256=$(cat artifacts/sha256-windows-x86_64/sha256-windows-x86_64.txt)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Check for release notes
        id: release_notes
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release (with custom notes)
        if: steps.release_notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v2
        with:
          files: |
            release/baken-${{ steps.version.outputs.VERSION }}-macos-universal.tar.gz
            release/baken-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
            release/baken-${{ steps.version.outputs.VERSION }}-linux-aarch64.tar.gz
            release/baken-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip
            release/baken-${{ steps.version.outputs.VERSION }}-checksums.txt
          body_path: RELEASE_NOTES.md

      - name: Create Release (auto-generated notes)
        if: steps.release_notes.outputs.exists == 'false'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v2
        with:
          files: |
            release/baken-${{ steps.version.outputs.VERSION }}-macos-universal.tar.gz
            release/baken-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
            release/baken-${{ steps.version.outputs.VERSION }}-linux-aarch64.tar.gz
            release/baken-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip
            release/baken-${{ steps.version.outputs.VERSION }}-checksums.txt
          generate_release_notes: true
          body: |
            ## Installation

            | Platform | Command |
            |----------|---------|
            | **macOS (Homebrew)** | `brew install M-Igashi/tap/baken` |
            | **Windows (winget)** | `winget install M-Igashi.baken` |
            | **Cargo** | `cargo install baken` (ffmpeg must be installed separately) |

            Package managers (Homebrew, winget) install ffmpeg automatically. mp3rgain is built-in — no separate installation needed.

            ## Checksums
            See `baken-${{ steps.version.outputs.VERSION }}-checksums.txt` for SHA256 checksums of all binaries.

  # =============================================================================
  # Publish to Cargo (crates.io)
  # =============================================================================

  publish-cargo:
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      # Trusted Publishing: crates.io trusts release.yml in the `release`
      # environment over OIDC for all three crates and hands out one token that
      # expires after 30 minutes, so no long-lived registry token exists to leak.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # A version that is already there is left alone, so the job can be run
      # again after a failure partway through the three crates.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION_NUM: ${{ needs.release.outputs.version_num }}
        run: |
          for crate in baken-core baken-export baken; do
            if curl -sf -A "release-workflow" "https://crates.io/api/v1/crates/${crate}/${VERSION_NUM}" > /dev/null; then
              echo "${crate} ${VERSION_NUM} is already on crates.io"
            else
              cargo publish -p "${crate}"
            fi
          done

  # =============================================================================
  # Update Homebrew (macOS)
  # =============================================================================

  update-homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          VERSION_NUM: ${{ needs.release.outputs.version_num }}
          SHA256: ${{ needs.release.outputs.macos_sha256 }}
        run: |

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/M-Igashi/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/baken.rb << 'FORMULA'
          class Baken < Formula
            desc "Audio loudness analyzer and gain adjustment tool for mastering and DJ workflows"
            homepage "https://github.com/M-Igashi/baken"
            url "https://github.com/M-Igashi/baken/releases/download/VERSION_PLACEHOLDER/baken-VERSION_PLACEHOLDER-macos-universal.tar.gz"
            sha256 "SHA256_PLACEHOLDER"
            version "VERSION_NUM_PLACEHOLDER"
            license "MIT"

            depends_on "ffmpeg"

            def install
              bin.install "baken"
              doc.install "LICENSE", "THIRD_PARTY_LICENSES.md"
            end

            def caveats
              <<~EOS
                mp3rgain is now built-in as a library dependency.
                No separate installation required for lossless MP3 gain adjustment.
              EOS
            end

            test do
              assert_match "baken", shell_output("#{bin}/baken --version")
            end
          end
          FORMULA

          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|g" Formula/baken.rb
          sed -i "s|SHA256_PLACEHOLDER|${SHA256}|g" Formula/baken.rb
          sed -i "s|VERSION_NUM_PLACEHOLDER|${VERSION_NUM}|g" Formula/baken.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/baken.rb
          # Nothing to commit when the job is run again.
          git diff --cached --quiet || git commit -m "baken ${VERSION_NUM}"
          git push
