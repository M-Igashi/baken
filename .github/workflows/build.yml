name: Build

# What a release builds and a Mac cannot check: the Linux and Windows
# targets compile SQLite from source (--onelibrary), and the third-party
# notices come from cargo-about. A break shows up here instead of at release
# time.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "about.toml"
      - "about.hbs"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: cargo build --release
      - run: ls -l target/release/baken
      - run: cargo test -p baken-export --lib -- onelibrary sqlcipher

  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: cargo install cross --git https://github.com/cross-rs/cross
      - run: cross build --release --target aarch64-unknown-linux-gnu
      - run: ls -l target/aarch64-unknown-linux-gnu/release/baken

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: cargo build --release
      - run: cargo test -p baken-export --lib -- onelibrary sqlcipher

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - run: cargo about generate -c about.toml -m crates/baken/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.md
