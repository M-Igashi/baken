name: Build

# What a release builds and a Mac cannot check: the Linux and Windows
# targets compile OpenSSL from source for SQLCipher (--onelibrary), and the
# third-party notices come from cargo-about. A break shows up here instead of
# at release time.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "about.toml"
      - "about.hbs"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - run: cargo build --release
      - run: cargo test -p baken-export --lib onelibrary

  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - run: cargo install cross --git https://github.com/cross-rs/cross
      - run: cross build --release --target aarch64-unknown-linux-gnu

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - run: cargo build --release
      - run: cargo test -p baken-export --lib onelibrary

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - run: cargo about generate -c about.toml -m crates/baken/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.md
