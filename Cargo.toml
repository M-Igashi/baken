[workspace]
resolver = "2"
members = ["crates/baken-core", "crates/baken"]

[workspace.package]
version = "3.3.1"
edition = "2021"
authors = ["Masanari Higashi"]
license = "MIT"
repository = "https://github.com/M-Igashi/baken"
homepage = "https://baken.ravers.workers.dev"

[workspace.dependencies]
# Keep in sync with workspace.package.version on every release.
baken-core = { path = "crates/baken-core", version = "3.3.1" }
anyhow = "1.0"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
