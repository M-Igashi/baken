[package]
name = "baken-export"
description = "Bake'n Deck device export: writes a rekordbox USB export (export.pdb + ANLZ) from collection.xml"
keywords = ["dj", "rekordbox", "cdj", "pioneer"]
categories = ["multimedia::audio"]
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
baken-core.workspace = true
anyhow.workspace = true
rayon.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
miniz_oxide = "0.9"
# Artwork: image decodes and scales the embedded picture, jpeg-encoder writes
# the thumbnails with 4:2:0 chroma as rekordbox does (image's encoder is 4:4:4).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
jpeg-encoder = "0.7"
symphonia.workspace = true
# `exportLibrary.db` (OneLibrary) is a SQLCipher 4 database, built with plain
# SQLite and encrypted page by page in `sqlcipher.rs`. SQLCipher itself needs
# OpenSSL outside Apple, which doubled the Linux and Windows binaries (#256).
rusqlite = { version = "0.41", features = ["bundled"] }
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Apple targets encrypt with CommonCrypto instead (baken-mac#83).
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = "0.13"
